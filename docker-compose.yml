# ============================================================
#  Gamefy — Docker Compose (Dev + Production)
#  Services: PostgreSQL · Redis · Backend · Front-Office · Back-Office
# ============================================================
#
#  Usage:
#    LOCAL DEV:   docker compose up -d
#    PRODUCTION:  docker compose --env-file .env.production up -d
# ============================================================

services:

  # ─── PostgreSQL Database ──────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: gamefy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gamefy}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-gamefy}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis Cache ──────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: gamefy-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Spring Boot Backend ──────────────────────────────────
  backend:
    image: mohamedoussemaboussida/gamefy-backend:${TAG:-latest}
    container_name: gamefy-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # ── Database (points to the postgres container) ──
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-gamefy}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      # ── Redis (points to the redis container) ──
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      # ── CORS (both localhost for dev + domain for production) ──
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174,http://localhost,http://localhost:8081}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - uploads_data:/app/uploads

  # ─── Front-Office (React SPA via Nginx) ───────────────────
  front-office:
    image: mohamedoussemaboussida/gamefy-front-office:${TAG:-latest}
    container_name: gamefy-front-office
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONT_OFFICE_PORT:-80}:80"

  # ─── Back-Office (React+TS SPA via Nginx) ─────────────────
  back-office:
    image: mohamedoussemaboussida/gamefy-back-office:${TAG:-latest}
    container_name: gamefy-back-office
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${BACK_OFFICE_PORT:-8081}:80"

volumes:
  postgres_data:
  redis_data:
  uploads_data:
