# =============================================================
# SonarQube Configuration — Back Office (React/TypeScript/Vite)
# =============================================================

sonar.projectKey=gamefy-back-office
sonar.projectName=gamefy-back-office

# Source code location
sonar.sources=src

# TypeScript configuration
sonar.typescript.tsconfigPath=tsconfig.app.json

# Tell SonarQube to treat .tsx as TypeScript files
sonar.typescript.file.suffixes=.ts,.tsx,.mts
sonar.javascript.file.suffixes=.js,.jsx,.mjs
sonar.css.file.suffixes=.css,.scss

# Exclusions — don't analyse build artifacts, mocks, or node_modules
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# No coverage for now
sonar.coverage.exclusions=**/*
