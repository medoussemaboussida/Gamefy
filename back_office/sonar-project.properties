# =============================================================
# SonarQube Configuration — Back Office (React/TypeScript/Vite)
# =============================================================

sonar.projectKey=gamefy-back-office
sonar.projectName=gamefy-back-office
sonar.sourceEncoding=UTF-8

# Source code location
sonar.sources=src

# Point SonarQube to the TypeScript config (correct property name)
sonar.typescript.tsconfigPaths=tsconfig.app.json

# Exclusions — don't analyse build artifacts or node_modules
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# No coverage for now
sonar.coverage.exclusions=**/*
