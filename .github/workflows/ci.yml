  # ─────────────────────────────────────────────────────────────────
  # Stage 5 — Backend: Tests + Coverage + SonarQube Scan
  # ─────────────────────────────────────────────────────────────────
  sonarqube-backend:
    name: 🧪 Tests + 📊 Coverage + 🔍 SonarQube (Backend)
    runs-on: self-hosted
    defaults:
      run:
        working-directory: gamefy_back
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: gamefy_back/pom.xml

      - name: Run Tests + Generate JaCoCo Coverage Report + SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          mvn verify sonar:sonar \
            -Dspring.profiles.active=test \
            -Dsonar.host.url=$SONAR_HOST_URL \
            -Dsonar.token=$SONAR_TOKEN \
            -Dsonar.projectKey=gamefy-backend \
            -Dsonar.projectName="gamefy-backend" \
            -Dsonar.java.source=21 \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            --batch-mode

  # ─────────────────────────────────────────────────────────────────
  # Stage 6 — Frontend: SonarQube Scan (Front Office + Back Office)
  # Runs in PARALLEL with Stage 5 — no dependency between them
  # ─────────────────────────────────────────────────────────────────
  sonarqube-frontend:
    name: 🔍 SonarQube (Front Office + Back Office)
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⬢ Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ── Front Office (React / JavaScript) ───────────────────────
      - name: 🔍 Scan Front Office
        uses: SonarSource/sonarqube-scan-action@v5
        with:
          projectBaseDir: front_office
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_FRONT_OFFICE }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      # ── Back Office (React / TypeScript) ────────────────────────
      - name: 🔍 Scan Back Office
        uses: SonarSource/sonarqube-scan-action@v5
        with:
          projectBaseDir: back_office
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_BACK_OFFICE }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  # ─────────────────────────────────────────────────────────────────
  # Stage 7 — Docker: Build & Push Images to Docker Hub
  # Builds all 3 images and only pushes if they have changed
  # ─────────────────────────────────────────────────────────────────
  docker-build-push:
    name: 🐳 Docker Build & Push
    needs: [sonarqube-backend, sonarqube-frontend]
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: 🔐 Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # ── Build Backend Image ──────────────────────────────────
      - name: 🏗️ Build Backend Image
        run: |
          docker build \
            -t mohamedoussemaboussida/gamefy-backend:latest \
            -t mohamedoussemaboussida/gamefy-backend:${{ github.sha }} \
            ./gamefy_back

      # ── Check & Push Backend ─────────────────────────────────
      - name: 🚀 Push Backend (if changed)
        run: |
          # Try to pull the existing latest image for comparison
          docker pull mohamedoussemaboussida/gamefy-backend:latest 2>/dev/null || true

          LOCAL_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' mohamedoussemaboussida/gamefy-backend:latest 2>/dev/null || echo "none")
          REMOTE_DIGEST=$(docker manifest inspect mohamedoussemaboussida/gamefy-backend:latest 2>/dev/null | grep -o '"digest":"[^"]*"' | head -1 || echo "none")

          if [ "$LOCAL_DIGEST" = "$REMOTE_DIGEST" ] && [ "$REMOTE_DIGEST" != "none" ]; then
            echo "⏭️ Backend image unchanged — skipping push"
          else
            echo "📤 Pushing backend image..."
            docker push mohamedoussemaboussida/gamefy-backend:latest
            docker push mohamedoussemaboussida/gamefy-backend:${{ github.sha }}
          fi

      # ── Build Front-Office Image ─────────────────────────────
      - name: 🏗️ Build Front-Office Image
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL=http://GamefyAcademy.tn:8080/api \
            --build-arg VITE_RECAPTCHA_SITE_KEY=${{ secrets.VITE_RECAPTCHA_SITE_KEY }} \
            --build-arg VITE_STRIPE_PUBLISHABLE_KEY=${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }} \
            --build-arg VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }} \
            --build-arg VITE_GROQ_API_KEY=${{ secrets.VITE_GROQ_API_KEY }} \
            -t mohamedoussemaboussida/gamefy-front-office:latest \
            -t mohamedoussemaboussida/gamefy-front-office:${{ github.sha }} \
            ./front_office

      # ── Check & Push Front-Office ────────────────────────────
      - name: 🚀 Push Front-Office (if changed)
        run: |
          docker pull mohamedoussemaboussida/gamefy-front-office:latest 2>/dev/null || true

          LOCAL_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' mohamedoussemaboussida/gamefy-front-office:latest 2>/dev/null || echo "none")
          REMOTE_DIGEST=$(docker manifest inspect mohamedoussemaboussida/gamefy-front-office:latest 2>/dev/null | grep -o '"digest":"[^"]*"' | head -1 || echo "none")

          if [ "$LOCAL_DIGEST" = "$REMOTE_DIGEST" ] && [ "$REMOTE_DIGEST" != "none" ]; then
            echo "⏭️ Front-office image unchanged — skipping push"
          else
            echo "📤 Pushing front-office image..."
            docker push mohamedoussemaboussida/gamefy-front-office:latest
            docker push mohamedoussemaboussida/gamefy-front-office:${{ github.sha }}
          fi

      # ── Build Back-Office Image ──────────────────────────────
      - name: 🏗️ Build Back-Office Image
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL=http://GamefyAcademy.tn:8080/api \
            --build-arg VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }} \
            -t mohamedoussemaboussida/gamefy-back-office:latest \
            -t mohamedoussemaboussida/gamefy-back-office:${{ github.sha }} \
            ./back_office

      # ── Check & Push Back-Office ─────────────────────────────
      - name: 🚀 Push Back-Office (if changed)
        run: |
          docker pull mohamedoussemaboussida/gamefy-back-office:latest 2>/dev/null || true

          LOCAL_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' mohamedoussemaboussida/gamefy-back-office:latest 2>/dev/null || echo "none")
          REMOTE_DIGEST=$(docker manifest inspect mohamedoussemaboussida/gamefy-back-office:latest 2>/dev/null | grep -o '"digest":"[^"]*"' | head -1 || echo "none")

          if [ "$LOCAL_DIGEST" = "$REMOTE_DIGEST" ] && [ "$REMOTE_DIGEST" != "none" ]; then
            echo "⏭️ Back-office image unchanged — skipping push"
          else
            echo "📤 Pushing back-office image..."
            docker push mohamedoussemaboussida/gamefy-back-office:latest
            docker push mohamedoussemaboussida/gamefy-back-office:${{ github.sha }}
          fi

      # ── Docker Compose Validation ────────────────────────────
      - name: ✅ Validate Docker Compose
        run: docker compose config --quiet
