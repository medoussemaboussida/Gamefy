  # ─────────────────────────────────────────────────────────────────
  # Stage 9 — Deploy to Production Server
  # SSHes into the remote server and deploys via docker-compose.
  # ─────────────────────────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to Production Server
    runs-on: self-hosted
    steps:
      - name: 🚀 Deploy via SSH
        run: |
          sshpass -p "${{ secrets.SERVER_PASSWORD }}" \
            ssh -o StrictHostKeyChecking=no \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "cd ~ && docker-compose pull && docker-compose up -d && docker image prune -f"

      - name: ✅ Verify Deployment
        run: |
          echo "⏳ Waiting 30s for services to start..."
          sleep 30
          sshpass -p "${{ secrets.SERVER_PASSWORD }}" \
            ssh -o StrictHostKeyChecking=no \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "docker-compose ps"