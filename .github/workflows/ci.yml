  # ─────────────────────────────────────────────────────────────────
  # Stage 7 — Docker: Build & Run with Docker Compose (Local)
  # Builds all images locally and starts the stack on the runner
  # No Docker Hub push needed — everything stays on the self-hosted runner
  # ─────────────────────────────────────────────────────────────────
  docker-compose:
    name: 🐳 Docker Compose Build & Run
    # needs: [sonarqube-backend, sonarqube-frontend]  # re-enable when SonarQube is back
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: 🛑 Stop existing containers (if any)
        run: docker-compose down --remove-orphans || true

      - name: 📋 Load production environment
        run: cp .env.production .env

      - name: 🏗️ Build all images
        run: docker-compose build

      - name: 🚀 Start all services
        run: docker-compose up -d

      - name: ✅ Verify services are running
        run: |
          echo "⏳ Waiting 30s for services to start..."
          sleep 30
          docker-compose ps
