name: Gamefy CI — Backend + Frontend

on:
  push:
    branches: [ oussema ]
  pull_request:
    branches: [ oussema ]

jobs:

  # ──────────────────────────────────────────────────────────────
  # Job 1 — Build + Test + JaCoCo Coverage (Backend)
  # Single checkout, single JDK setup, one Maven invocation.
  # `mvn clean verify` = clean → compile → test → package → JaCoCo
  # ──────────────────────────────────────────────────────────────
  build-and-test:
    name: Build + Test + Coverage (Backend)
    runs-on: self-hosted
    defaults:
      run:
        working-directory: gamefy_back
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: gamefy_back/pom.xml

      - name: mvn clean verify (compile + test + JaCoCo in one shot)
        run: |
          chmod +x mvnw
          ./mvnw clean verify -Dspring.profiles.active=test --batch-mode

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: |
            gamefy_back/target/*.jar
            gamefy_back/target/classes/
            gamefy_back/target/site/jacoco/jacoco.xml
          retention-days: 1

  # ──────────────────────────────────────────────────────────────
  # Job 2 — SonarQube Scan (Backend + Front Office + Back Office)
  # Reuses the JaCoCo report from Job 1 — no rebuild needed.
  # ──────────────────────────────────────────────────────────────
  sonarqube:
    name: 🔍 SonarQube (Backend + Frontends)
    needs: build-and-test
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: gamefy_back/pom.xml

      - name: ⬢ Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 📥 Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: backend-build
          path: gamefy_back

      - name: 🔍 SonarQube — Backend
        working-directory: gamefy_back
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          chmod +x mvnw
          ./mvnw sonar:sonar \
            -Dsonar.host.url=$SONAR_HOST_URL \
            -Dsonar.token=$SONAR_TOKEN \
            -Dsonar.projectKey=gamefy-backend \
            -Dsonar.projectName="gamefy-backend" \
            -Dsonar.java.source=21 \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            --batch-mode

      # ── Front Office (React / JavaScript) ──────────────────
      - name: 🔍 SonarQube — Front Office
        uses: SonarSource/sonarqube-scan-action@v5
        with:
          projectBaseDir: front_office
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_FRONT_OFFICE }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      # ── Back Office (React / TypeScript) ───────────────────
      - name: 🔍 SonarQube — Back Office
        uses: SonarSource/sonarqube-scan-action@v5
        with:
          projectBaseDir: back_office
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_BACK_OFFICE }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  # ──────────────────────────────────────────────────────────────
  # Job 3 — Smart Deploy to Production Server
  # Checks if services are already running with latest images.
  # Only redeploys if new images are available.
  # ──────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Server
    needs: sonarqube
    runs-on: self-hosted
    steps:
      - name: Check & Deploy (skip if already up-to-date)
        run: |
          sshpass -p "${{ secrets.SERVER_PASSWORD }}" \
            ssh -o StrictHostKeyChecking=no \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'DEPLOY_SCRIPT'

          cd ~
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🔍 Checking current deployment status..."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          # Pull latest images and capture output
          PULL_OUTPUT=$(docker-compose pull 2>&1)
          echo "$PULL_OUTPUT"

          # Check if any image was actually updated (i.e. a new layer was downloaded)
          if echo "$PULL_OUTPUT" | grep -q "Downloaded newer image\|Pull complete"; then
            echo ""
            echo "🆕 New images detected — redeploying..."
            docker-compose up -d
            docker image prune -f
            echo "✅ Deployment updated successfully!"
          else
            # Also check if all containers are running
            RUNNING=$(docker-compose ps --services --filter "status=running" 2>/dev/null | wc -l)
            TOTAL=$(docker-compose ps --services 2>/dev/null | wc -l)

            if [ "$RUNNING" -eq "$TOTAL" ] && [ "$TOTAL" -gt 0 ]; then
              echo ""
              echo "✅ All $RUNNING services already running with latest images."
              echo "⏭️  Skipping deployment — nothing to do!"
            else
              echo ""
              echo "⚠️  Some services are not running ($RUNNING/$TOTAL). Restarting..."
              docker-compose up -d
              docker image prune -f
              echo "✅ Services restarted!"
            fi
          fi

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📋 Current service status:"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          docker-compose ps
          DEPLOY_SCRIPT
