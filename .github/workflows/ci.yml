  # ──────────────────────────────────────────────
  # Stage 5 — Tests + Coverage + SonarQube Scan
  # ──────────────────────────────────────────────
  sonarqube:
    name: 🧪 Tests + 📊 Coverage + 🔍 SonarQube
    runs-on: self-hosted
    defaults:
      run:
        working-directory: gamefy_back
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: gamefy_back/pom.xml

      - name: Run Tests + Generate JaCoCo Coverage Report + SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          mvn verify sonar:sonar \
            -Dspring.profiles.active=test \
            -Dsonar.host.url=$SONAR_HOST_URL \
            -Dsonar.token=$SONAR_TOKEN \
            -Dsonar.projectKey=gamefy-backend \
            -Dsonar.projectName="gamefy-backend" \
            -Dsonar.java.source=21 \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            --batch-mode
