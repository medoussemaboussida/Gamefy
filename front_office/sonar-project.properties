# =============================================================
# SonarQube Configuration — Front Office (React/Vite)
# =============================================================

sonar.projectKey=gamefy-front-office
sonar.projectName=gamefy-front-office

# Source code location
sonar.sources=src

# Tell SonarQube to treat .jsx as JavaScript files
sonar.javascript.file.suffixes=.js,.jsx,.mjs,.cjs
sonar.css.file.suffixes=.css,.scss

# Exclusions — don't analyse build artifacts, mocks, or node_modules
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.test.js,**/*.test.jsx,**/*.spec.js,**/*.spec.jsx

# No coverage for now
sonar.coverage.exclusions=**/*
