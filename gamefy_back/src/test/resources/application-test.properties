# ─────────────────────────────────────────────────────────────────────────────
# Test profile — used when running tests in CI and locally with -P test
# Replaces PostgreSQL + Redis with lightweight in-memory equivalents
# so tests work without any external services running.
# ─────────────────────────────────────────────────────────────────────────────

# H2 in-memory database (replaces PostgreSQL)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Fully disable Redis for tests:
# 1. RedisConfig (@Profile "!test") won't load our custom RedisCacheManager
# 2. These exclusions stop Spring Boot from auto-creating RedisConnectionFactory / RedisTemplate at all
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
spring.cache.type=none

# Stub mail server (tests won't actually send emails)
spring.mail.host=localhost
spring.mail.port=25

# Disable Stripe / external API calls causing startup issues
# (override any prod keys with dummy values)
stripe.secret.key=sk_test_dummy
google.client.id=dummy-google-client-id

# JWT secret (any base64-safe string is fine for tests)
application.security.jwt.secret-key=dGVzdC1zZWNyZXQta2V5LWZvci1qdW5pdC10ZXN0cy1vbmx5LTEyMzQ1Ng==
application.security.jwt.expiration=3600000
application.security.jwt.refresh-token.expiration=86400000
